# Overlay packages kept current by .github/workflows/update-packages.yml.
# Fields: package, type, merge policy, smoke test (the rest of the line).
#   type:  bin       upstream prebuilt binary; only the version changes
#          cargo     Rust; CRATES and crate licenses are regenerated with pycargoebuild
#          go        Go; EGO_SUM is regenerated from upstream's go.sum
#          nchat     Go plus the libsignal-ffi version that nchat's source requires
#          snapshot  no releases; follows upstream's default branch
#   merge: pr        open a pull request for review
#          auto      merge once pkgcheck, the build and the smoke test pass
# net-libs/libsignal-ffi is updated together with net-im/nchat; gui-wm/dwl is live.
dev-util/shfmt-bin                      bin       pr  shfmt --version
net-misc/localsend-bin                  bin       pr  test -x /opt/localsend/localsend_app
app-misc/unimatrix                      snapshot  pr  unimatrix --help
app-misc/yazi                           cargo     pr  yazi --version
gui-apps/ripdrag                        cargo     pr  ripdrag --help
gui-apps/wayland-pipewire-idle-inhibit  cargo     pr  wayland-pipewire-idle-inhibit --help
app-misc/hck                            cargo     pr  hck --help
www-client/wiki-tui                     cargo     pr  wiki-tui --help
app-misc/timer                          go        pr  timer --help
gui-apps/clipse                         go        pr  clipse --help
net-im/nchat                            nchat     pr  nchat --help
