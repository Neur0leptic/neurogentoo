CC="gcc"
CXX="g++"
CPP="cpp"
LD="ld.bfd"
COMMON_FLAGS="-march=native -O2 -pipe"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"
LDFLAGS="-Wl,-O2 -Wl,--as-needed"
RUSTFLAGS="-C debuginfo=0 -C codegen-units=1 -C target-cpu=native -C opt-level=3"
ACCEPT_KEYWORDS="~amd64"
RUBY_TARGETS="ruby40"
RUBY_SINGLE_TARGET="ruby40"
LUA_TARGETS="lua5-4"
LUA_SINGLE_TARGET="lua5-4"
PERL_FEATURES="ithreads"
MAKEOPTS="-j@BUILD_JOBS@ -l@BUILD_LOAD@"
EMERGE_DEFAULT_OPTS="--jobs=@EMERGE_JOBS@ --load-average=@BUILD_LOAD@ --verbose --with-bdeps=y --complete-graph=y --deep"
