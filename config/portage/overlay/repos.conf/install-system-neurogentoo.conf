[neurogentoo]
location = /var/db/repos/neurogentoo
sync-type = git
sync-uri = https://github.com/Neur0leptic/neurogentoo.git
sync-git-clone-extra-opts = --branch main --single-branch
auto-sync = yes
# Keep native repository updates separate from resumable compiler-policy snapshots.
# Never let Portage reset or clean locally edited recipes.
volatile = yes
clone-depth = 0
sync-depth = 0
